<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VIP Availability | SunScale Geckos</title><link rel="stylesheet" href="./sunscale-demo.css"></head>
<body>
  <main class="split">
    <section class="copy">
      <p class="eyebrow">VIP availability</p>
      <h1>Get first look at future geckos</h1>
      <p>VIP buyers hear about upcoming animals, show pickup options, and future clutch updates before the public feed sees them.</p>
      <form>
        <input name="firstName" placeholder="First name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="phone" type="tel" placeholder="Mobile phone">
        <select name="price_tier"><option>Mid-Range ($75-250)</option><option>Premium ($250-750)</option><option>Designer ($750+)</option></select>
        <select name="shipping_preference"><option>Hold at FedEx</option><option>Ship to Home</option><option>Local Pickup</option><option>Show Pickup</option></select>
        <button type="submit">Join VIP List</button>
      </form>
    </section>
    <section class="visual"><img src="../../../docs/demo-showroom/visual-assets/qr-placeholder.svg" alt="VIP QR code"></section>
  </main>
</body>
</html>
